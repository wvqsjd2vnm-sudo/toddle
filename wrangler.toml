name = "games"
main = "src/worker.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./site"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "games-codes"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"
migrations_dir = "migrations"

# Secrets (never commit them):
#   wrangler secret put ADMIN_CODE      -> your admin code
#   wrangler secret put SESSION_SECRET  -> any long random string
